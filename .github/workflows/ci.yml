name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Tauri + windows-rs/UIA/Core Audio need the real thing, not a Linux runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check KiBoard-protocol pin isn't stale
        shell: bash
        run: |
          cd KiBoard-protocol
          git fetch --tags origin
          current_tag=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          latest_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "Pinned: ${current_tag:-<untagged commit>}, latest: $latest_tag"
          if [ -z "$current_tag" ]; then
            echo "::warning::Submodule is pinned to a commit with no tag; consider pinning to a tag."
            exit 0
          fi
          cur_major=$(echo "$current_tag" | sed -E 's/^v([0-9]+)\.([0-9]+).*/\1/')
          cur_minor=$(echo "$current_tag" | sed -E 's/^v([0-9]+)\.([0-9]+).*/\2/')
          latest_major=$(echo "$latest_tag" | sed -E 's/^v([0-9]+)\.([0-9]+).*/\1/')
          latest_minor=$(echo "$latest_tag" | sed -E 's/^v([0-9]+)\.([0-9]+).*/\2/')
          if [ "$cur_major" != "$latest_major" ] || [ $((latest_minor - cur_minor)) -gt 1 ]; then
            echo "::error::KiBoard-protocol pin ($current_tag) is more than one minor version behind latest ($latest_tag)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        run: npm install

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Build editor frontend
        run: npm run build
