[package]
name = "desktop"
version = "0.1.14"
description = "KiBoard Host"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
enigo = "0.3"
xcap = "0.0.14"
local-ip-address = "0.6"
qrcode = "0.14"
# Auth del obs-websocket v5 (challenge/response SHA256)
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
dirs = "5"
active-win-pos-rs = "0.8"
windows-icons = "0.3"
windows = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp"] }
uiautomation = "0.25.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }

