# Builds the host on a tag and publishes it to the PUBLIC releases repo, which is where the updater
# looks. Manual dispatch is there so a release can be re-cut without moving the tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `tauri-action` builds, signs and writes `latest.json` — the feed the updater reads. Without
      # the signing secrets it still builds, but produces an unsigned bundle no installed host will
      # accept, so fail loudly instead of publishing something that cannot be installed over.
      - name: Refuse to publish unsigned
        if: env.TAURI_SIGNING_PRIVATE_KEY == ''
        run: |
          echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. See 'Releases and updates' in the README."
          exit 1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - uses: tauri-apps/tauri-action@v0
        env:
          # Writes the release into the public releases repo, not this private one: the updater has
          # to read the feed without a token.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: maxia-cl
          repo: KiBoard-windows-host-releases
          tagName: ${{ github.ref_name }}
          releaseName: KiBoard ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md in the host repository.
          releaseDraft: true
          includeUpdaterJson: true
